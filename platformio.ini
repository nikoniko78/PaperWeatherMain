[env:m5stack-paper]
platform = espressif32
board = m5stack-paper
framework = arduino
platform_packages =
    platformio/toolchain-xtensa-esp-elf@14.2.0+20241119
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson
