[env:m5stack-fire]
platform = espressif32 @ 6.9.0
board = m5stack-fire
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = 
    m5stack/M5Unified @ ^0.2.27
    bblanchon/ArduinoJson @ ^7.4.3
build_flags = 
    -DNetworkClientSecure=WiFiClientSecure
    -DNetworkClient=WiFiClient
    -DuseBuiltinCACertBundle=setInsecure
